<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">ShopLedger architecture</title>
<desc id="desc">Architecture map for ShopLedger, with the numbered order placement flow and ticket modules highlighted.</desc>
<defs>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#64748b"/></marker>
  <marker id="blueArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2563eb"/></marker>
  <style>
    text{font-family:Arial,Helvetica,sans-serif;fill:#172033}
    .title{font-size:24px;font-weight:700}.subtitle{font-size:13px;fill:#475569}
    .section{font-size:14px;font-weight:700;fill:#334155}
    .box{fill:#fff;stroke:#94a3b8;stroke-width:1.4;rx:10}
    .core{fill:#eff6ff;stroke:#60a5fa}.ticket{fill:#fff7d6;stroke:#d49b16;stroke-width:2}
    .head{font-size:15px;font-weight:700}.small{font-size:12px}.tiny{font-size:12px;fill:#475569}
    .flow{fill:none;stroke:#2563eb;stroke-width:2.2;marker-end:url(#blueArrow)}
    .link{fill:none;stroke:#64748b;stroke-width:1.4;marker-end:url(#arrow)}
    .dash{stroke-dasharray:5 4}
    .step{fill:#2563eb;stroke:#fff;stroke-width:2}
    .steptext{font-size:13px;font-weight:700;fill:#fff;text-anchor:middle;dominant-baseline:central}
  </style>
</defs>
<rect width="1200" height="800" fill="#f8fafc"/>
<text x="32" y="38" class="title">ShopLedger · application architecture</text>
<text x="32" y="61" class="subtitle">Node / Express POS, Khata ledger and GST invoicing · arrows show main order placement path</text>

<!-- Browser UI -->
<rect x="28" y="100" width="198" height="150" class="box"/>
<text x="44" y="126" class="head">Browser UI · public/</text>
<text x="44" y="150" class="small">index.html · style.css</text>
<text x="44" y="171" class="small">js/app.js · POS/cart</text>
<text x="44" y="194" class="tiny">POST /api/orders</text>
<text x="44" y="215" class="tiny">GET products/customers</text>
<text x="44" y="236" class="tiny">orders, settlement, reports</text>

<!-- Server -->
<rect x="276" y="100" width="190" height="150" class="box core"/>
<text x="294" y="128" class="head">server.js</text>
<text x="294" y="152" class="small">Express app + JSON body</text>
<text x="294" y="174" class="small">serves public/ static</text>
<text x="294" y="196" class="small">mounts routers at /api</text>
<text x="294" y="220" class="tiny">invoice route: /orders/:id/invoice</text>

<!-- Routers -->
<text x="510" y="92" class="section">routes/ · mounted at /api</text>
<rect x="506" y="104" width="194" height="67" class="box core"/>
<text x="520" y="128" class="head">orders.js</text><text x="520" y="151" class="small">POST /orders · GET · cancel</text>
<rect x="718" y="104" width="208" height="67" class="box ticket"/>
<text x="732" y="128" class="head">customers.js</text><text x="732" y="151" class="small">GET /customers · POST settle</text>
<rect x="506" y="187" width="194" height="67" class="box"/>
<text x="520" y="211" class="head">products.js</text><text x="520" y="234" class="small">GET products · coupons</text>
<rect x="718" y="187" width="208" height="67" class="box"/>
<text x="732" y="211" class="head">reports.js</text><text x="732" y="234" class="small">dashboard · preview · GST</text>

<!-- Config and persistence -->
<rect x="986" y="102" width="184" height="88" class="box"/>
<text x="1001" y="128" class="head">config.js</text><text x="1001" y="151" class="small">shop · tax · coupons</text><text x="1001" y="173" class="small">port · inventory defaults</text>
<rect x="986" y="206" width="184" height="88" class="box core"/>
<text x="1001" y="232" class="head">data/db.json</text><text x="1001" y="255" class="small">products · orders</text><text x="1001" y="277" class="small">customers · settlements · audit</text>

<!-- Flow heading -->
<rect x="28" y="320" width="1142" height="58" rx="10" fill="#dbeafe" stroke="#93c5fd"/>
<text x="48" y="345" class="section">ORDER PLACEMENT · numbered path</text>
<text x="48" y="365" class="small">Browser click “Place order” → POST /api/orders → validate, calculate, update in-memory data → write JSON → return created order</text>

<!-- Flow cards -->
<rect x="28" y="410" width="205" height="124" class="box core"/>
<circle cx="48" cy="430" r="14" class="step"/><text x="48" y="430" class="steptext">1</text>
<text x="70" y="434" class="head">public/js/app.js</text>
<text x="44" y="461" class="small">place.onclick gathers cart</text>
<text x="44" y="482" class="small">and POSTs /api/orders</text>
<text x="44" y="510" class="tiny">items, customer, mode, coupon</text>

<rect x="266" y="410" width="205" height="124" class="box core"/>
<circle cx="286" cy="430" r="14" class="step"/><text x="286" y="430" class="steptext">2</text>
<text x="308" y="434" class="head">routes/orders.js</text>
<text x="282" y="461" class="small">POST /orders resolves items</text>
<text x="282" y="482" class="small">and validates product IDs</text>
<text x="282" y="510" class="tiny">quantity fallback: 1</text>

<rect x="504" y="410" width="205" height="124" class="box core"/>
<circle cx="524" cy="430" r="14" class="step"/><text x="524" y="430" class="steptext">3</text>
<text x="546" y="434" class="head">Stock + price</text>
<text x="520" y="461" class="small">inventory.check()</text>
<text x="520" y="482" class="small">pricing subtotal / totals</text>
<text x="520" y="510" class="tiny">coupons.validate · tax HSN rates</text>

<rect x="742" y="410" width="205" height="124" class="box ticket"/>
<circle cx="762" cy="430" r="14" class="step"/><text x="762" y="430" class="steptext">4</text>
<text x="784" y="434" class="head">Khata (if selected)</text>
<text x="758" y="461" class="small">ledger.findCustomer()</text>
<text x="758" y="482" class="small">chargeOrderToKhata()</text>
<text x="758" y="510" class="tiny">credit limit + customer totals</text>

<rect x="980" y="410" width="190" height="124" class="box core"/>
<circle cx="1000" cy="430" r="14" class="step"/><text x="1000" y="430" class="steptext">5</text>
<text x="1022" y="434" class="head">Persist + respond</text>
<text x="996" y="461" class="small">inventory.reserve()</text>
<text x="996" y="482" class="small">orders.add() + audit</text>
<text x="996" y="510" class="tiny">store.write() → db.json · 201</text>

<path d="M233 472 H260" class="flow"/><path d="M471 472 H498" class="flow"/><path d="M709 472 H736" class="flow"/><path d="M947 472 H974" class="flow"/>

<!-- Libraries map -->
<text x="28" y="578" class="section">lib/ · domain logic and persistence</text>
<rect x="28" y="592" width="246" height="76" class="box core"/>
<text x="42" y="616" class="head">store.js</text><text x="42" y="639" class="small">read() · write() · appendAudit()</text><text x="42" y="657" class="tiny">reads/writes data/db.json</text>
<rect x="286" y="592" width="246" height="76" class="box core"/>
<text x="300" y="616" class="head">inventory.js</text><text x="300" y="639" class="small">find · check · reserve · release</text><text x="300" y="657" class="tiny">stock and sellable quantities</text>
<rect x="544" y="592" width="246" height="76" class="box core"/>
<text x="558" y="616" class="head">pricing.js · coupons.js · tax.js</text><text x="558" y="639" class="small">subtotal · discounts · GST slabs</text><text x="558" y="657" class="tiny">pricing → coupons + tax</text>
<rect x="802" y="592" width="174" height="76" class="box core"/>
<text x="816" y="616" class="head">orders.js</text><text x="816" y="639" class="small">add · get · cancel</text>
<rect x="812" y="646" width="146" height="18" rx="4" fill="#fff7d6" stroke="#d49b16"/>
<text x="820" y="660" class="tiny">list() · ticket focus</text>
<rect x="988" y="592" width="182" height="76" class="box ticket"/>
<text x="1002" y="616" class="head">dates.js</text><text x="1002" y="639" class="small">today · normalizeDateKey</text><text x="1002" y="657" class="tiny">getFiscalYear</text>

<rect x="28" y="683" width="246" height="76" class="box ticket"/>
<text x="42" y="707" class="head">ledger.js</text><text x="42" y="730" class="small">charge · reverse · settlement</text><text x="42" y="748" class="tiny">findCustomer · listCustomers</text>
<rect x="286" y="683" width="246" height="76" class="box core"/>
<text x="300" y="707" class="head">invoice.js</text><text x="300" y="730" class="small">computeInvoiceFigures · render</text><text x="300" y="748" class="tiny">HTML invoice calculations</text>
<rect x="544" y="683" width="246" height="76" class="box core"/>
<text x="558" y="707" class="head">reports.js</text><text x="558" y="730" class="small">dashboard · GST reconciliation</text><text x="558" y="748" class="tiny">uses inventory, ledger, invoice</text>

<!-- Legend -->
<rect x="802" y="683" width="368" height="76" rx="10" fill="#fff" stroke="#cbd5e1"/>
<text x="818" y="707" class="head">Legend</text>
<rect x="818" y="719" width="18" height="16" rx="3" fill="#fff7d6" stroke="#d49b16" stroke-width="2"/>
<text x="844" y="732" class="small">Ticket focus (orders.js list only, dates.js, ledger.js,</text>
<text x="844" y="750" class="small">routes/customers.js)</text>
<rect x="818" y="740" width="18" height="12" rx="3" fill="#eff6ff" stroke="#60a5fa"/>
<text x="844" y="751" class="small">Core order path / supporting module</text>

<!-- Main architecture links -->
<path d="M226 175 H270" class="link"/>
<path d="M466 136 H500" class="link"/>
<path d="M466 136 C484 136 484 220 500 220" class="link"/>
<path d="M466 136 C590 75 692 75 712 136" class="link dash"/>
<path d="M466 136 C610 80 894 73 980 143" class="link dash"/>
<path d="M1090 190 V200" class="link"/>
<!-- persistence relation from store to JSON -->
<path d="M150 668 V772 H1080 V300" class="link dash"/>
<text x="844" y="779" class="tiny">store.read/write → JSON file</text>
</svg>
